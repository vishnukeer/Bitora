<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> — Crypto Market Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    
<aside class="w-72 min-h-screen bg-white border-r border-gray-200 flex flex-col px-5 py-7">

  <!-- BRAND -->
  <div class="flex items-center gap-3 px-2 mb-12">
    <div class="w-11 h-11 rounded-xl bg-[#FFF3E0] flex items-center justify-center">
      <span class="text-3xl font-bold text-[#F7931A]"><i class="fa-brands fa-bitcoin"></i></span>
    </div>

    <h1 class="text-2xl font-bold tracking-tight text-[#242424]">
      Bitora
    </h1>
  </div>

  <!-- MENU -->
  <div class="mb-9">
    <p class="text-xs font-bold tracking-widest text-gray-400 px-3 mb-4">
      PANEL
    </p>

    <nav class="space-y-2">

      <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-xl bg-[#FFF3E0] text-[#D97706] font-semibold">
        <span class="text-xl"><i class="fa-solid fa-arrow-up-right-dots"></i></span>
        Overview
      </a>

      <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-100 hover:text-[#F7931A] transition">
        <span class="text-xl"><i class="fa-brands fa-mailchimp"></i></span>
        Markets
      </a>

      <a href="#" class="flex items-center justify-between px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-100 hover:text-[#F7931A] transition">
        <span class="flex items-center gap-4">
          <span class="text-xl"><i class="fa-regular fa-star"></i></span>
          Watchlist
        </span>

        <span class="bg-[#FFF0D9] text-[#D97706] text-xs px-2.5 py-1 rounded-full">
          0
        </span>
      </a>

    </nav>
  </div>

  <!-- EXPLORE -->
  <div>
    <p class="text-xs font-bold tracking-widest text-gray-400 px-3 mb-4">
      EXPLORE
    </p>

    <nav class="space-y-2">

      <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-100 hover:text-[#F7931A] transition">
        <span class="text-xl"><i class="fa-solid fa-arrows-to-dot"></i></span>
        All assets
      </a>

    </nav>
  </div>

  <!-- SPACER -->
  <div class="flex-1 min-h-12"></div>

  <!-- PROMO CARD -->
  <div class="bg-[#FFF7EB] border border-[#FCE3C0] rounded-2xl p-5 mb-7">

    <div class="w-9 h-9 rounded-lg bg-white flex items-center justify-center text-[#F7931A] text-xl mb-4">
      <i class="fa-brands fa-bitcoin"></i>
    </div>

    <h3 class="font-semibold text-[#242424] mb-2">
      New to crypto?
    </h3>

    <p class="text-sm text-gray-500 leading-relaxed mb-5">
      Explore the market at your own pace.
    </p>

    <a href="https://bitcoin.org/en/" target="_blank"
       class="text-sm font-semibold text-[#D97706] hover:text-[#F7931A]">
      Learn the basics <i class="fa-solid fa-location-arrow"></i>
    </a>

  </div>

  <!-- PROFILE -->
  <div class="flex items-center justify-between px-1">

    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-[#FFE5C2] flex items-center justify-center text-[#B45309] font-semibold">
        V
      </div>

      <div>
        <h4 class="text-sm font-semibold text-[#242424]">
          Vishnu Keer
        </h4>

        <p class="text-xs text-gray-500">
          Personal account
        </p>
      </div>
    </div>

    <button class="text-gray-400 hover:text-[#F7931A] text-xl">
        ...
    </button>

  </div>

</aside>

</body>
</html>
